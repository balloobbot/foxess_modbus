[tool.mypy]
strict = true
allow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true
# Home Assistant packages re-export names without listing them in __all__.
implicit_reexport = true

[[tool.mypy.overrides]]
module = 'pytest_homeassistant_custom_component.*'
ignore_missing_imports = true

[tool.ruff]
lint.select = ["E", "F", "I", "N", "ANN", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "G",
    "PIE", "PYI", "RET", "SLF", "SIM", "ARG", "PTH", "PLE", "PLC", "PLW", "FLY", "RUF"]
lint.ignore = [
    "ANN401", # any-type
    "S101", # assert
    "SIM108", # if-else-block-instead-of-if-exp
    "COM812", # misisng-trailing-comma
    "PLW2901", # redefiend-loop-name
    "RET504", # unnecessary-assign
]
lint.unfixable = [
    "F841", # unused-variable
]
line-length = 120
target-version = "py313"
# Vendored from foxess-inverter, which lints it with its own settings.
extend-exclude = [
    'custom_components/foxess_modbus/foxess_inverter',
]

[tool.ruff.lint.per-file-ignores]
# Home Assistant fixes the platform module names and the signatures of the
# functions it calls, whether or not they use every argument.
"custom_components/**" = ["A005", "ARG001", "ARG002", "ARG004"]
# Tests request pytest fixtures by argument, whether or not they use them.
"tests/**" = ["ARG001"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
