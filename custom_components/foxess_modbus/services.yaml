read_registers:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: foxess_modbus
    start_address:
      required: true
      example: 31000
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      required: true
      default: 1
      selector:
        number:
          min: 1
          max: 125
          mode: box
    type:
      required: true
      default: holding
      selector:
        select:
          translation_key: register_type
          options:
            - input
            - holding
write_registers:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: foxess_modbus
    start_address:
      required: true
      example: 41001
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    values:
      required: true
      example: "1, 2, 3"
      selector:
        text:
update_charge_period:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: foxess_modbus
    charge_period:
      required: true
      selector:
        select:
          translation_key: charge_period
          options:
            - "1"
            - "2"
    enable_force_charge:
      required: true
      selector:
        boolean:
    enable_charge_from_grid:
      required: true
      selector:
        boolean:
    start:
      example: "00:30"
      selector:
        time:
    end:
      example: "04:30"
      selector:
        time:
update_all_charge_periods:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: foxess_modbus
    charge_periods:
      required: true
      example: |
        - enable_force_charge: true
          enable_charge_from_grid: true
          start: "00:30"
          end: "04:30"
        - enable_force_charge: false
          enable_charge_from_grid: false
      selector:
        object:
